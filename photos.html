seo_title: "Amit Khandelwal | Photography"
permalink: /photos/

<style>
.gallery {
  margin: 0 0 2rem;
  /* Row layout is computed in JS; until then keep the area from collapsing. */
  min-height: 40vh;
}

.gallery__row {
  display: flex;
  margin-bottom: 6px;
}

.gallery__item {
  position: relative;
  display: block;
  margin-right: 6px;
  overflow: hidden;
  background: #ececec;
  cursor: zoom-in;
  flex: none;
}

.gallery__row .gallery__item:last-child {
  margin-right: 0;
}

.gallery__item img {
  display: block;
  width: 100%;
  height: 100%;
  object-fit: cover;
  opacity: 0;
  transition: opacity 0.4s ease, transform 0.45s ease;
}

.gallery__item img.is-loaded {
  opacity: 1;
}

.gallery__item:hover img,
.gallery__item:focus-visible img {
  transform: scale(1.04);
}

.gallery__item:focus-visible {
  outline: 2px solid #2c5282;
  outline-offset: 2px;
}

/* --- Lightbox --- */
.lightbox {
  position: fixed;
  inset: 0;
  z-index: 1000;
  display: none;
  align-items: center;
  justify-content: center;
  background: rgba(12, 12, 14, 0.97);
  opacity: 0;
  transition: opacity 0.25s ease;
}

.lightbox.is-open {
  display: flex;
  opacity: 1;
}

.lightbox__figure {
  margin: 0;
  max-width: 92vw;
  max-height: 92vh;
  display: flex;
  align-items: center;
  justify-content: center;
}

.lightbox__img {
  max-width: 92vw;
  max-height: 88vh;
  object-fit: contain;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6);
  opacity: 0;
  transition: opacity 0.25s ease;
}

.lightbox__img.is-loaded {
  opacity: 1;
}

.lightbox__btn {
  position: absolute;
  top: 50%;
  transform: translateY(-50%);
  width: 56px;
  height: 56px;
  border: 0;
  border-radius: 50%;
  background: rgba(255, 255, 255, 0.08);
  color: #fff;
  font-size: 1.6rem;
  line-height: 1;
  cursor: pointer;
  transition: background 0.2s ease;
}

.lightbox__btn:hover {
  background: rgba(255, 255, 255, 0.2);
}

.lightbox__btn--prev { left: 2vw; }
.lightbox__btn--next { right: 2vw; }

.lightbox__close {
  position: absolute;
  top: 1.25rem;
  right: 1.5rem;
  width: 44px;
  height: 44px;
  border: 0;
  background: transparent;
  color: #fff;
  font-size: 2rem;
  line-height: 1;
  cursor: pointer;
  opacity: 0.7;
}

.lightbox__close:hover { opacity: 1; }

.lightbox__counter {
  position: absolute;
  bottom: 1.5rem;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255, 255, 255, 0.55);
  font-family: "Roboto Slab", serif;
  font-size: 0.8rem;
  letter-spacing: 0.08em;
}

.lightbox__caption {
  position: absolute;
  bottom: 3.25rem;
  left: 0;
  right: 0;
  text-align: center;
  color: rgba(255, 255, 255, 0.8);
  font-family: "Roboto Slab", serif;
  font-size: 0.9rem;
  padding: 0 2rem;
}

body.lightbox-open {
  overflow: hidden;
}

@media (max-width: 600px) {
  .lightbox__btn { width: 44px; height: 44px; font-size: 1.2rem; }
  .lightbox__btn--prev { left: 0.5rem; }
  .lightbox__btn--next { right: 0.5rem; }
}
</style>

<div class="gallery" id="gallery"></div>

<div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Photo viewer">
  <button class="lightbox__close" type="button" data-lb-close aria-label="Close">&times;</button>
  <button class="lightbox__btn lightbox__btn--prev" type="button" data-lb-prev aria-label="Previous photo">&#8249;</button>
  <figure class="lightbox__figure">
    <img class="lightbox__img" id="lightbox-img" alt="">
  </figure>
  <button class="lightbox__btn lightbox__btn--next" type="button" data-lb-next aria-label="Next photo">&#8250;</button>
  <div class="lightbox__caption" id="lightbox-caption"></div>
  <div class="lightbox__counter" id="lightbox-counter"></div>
</div>

<script>
(function () {
  var THUMB_BASE = '{{ site.baseurl }}/files/wildlife-nature/web/thumb/';
  var LARGE_BASE = '{{ site.baseurl }}/files/wildlife-nature/web/large/';

  var PHOTOS = [
    {% for photo in site.data.gallery -%}
    { slug: {{ photo.slug | jsonify }}, w: {{ photo.width }}, h: {{ photo.height }}, caption: {{ photo.caption | default: "" | jsonify }} }{% unless forloop.last %},{% endunless %}
    {% endfor -%}
  ];

  var gallery = document.getElementById('gallery');
  if (!gallery || !PHOTOS.length) { return; }

  var GAP = 6;

  function targetRowHeight(width) {
    if (width < 500) { return 190; }
    if (width < 800) { return 230; }
    return 280;
  }

  // Justified rows: fill each row with images at a common height, then scale the
  // row so its total width exactly matches the container (SmugMug-style).
  function layout() {
    var containerWidth = gallery.clientWidth;
    if (!containerWidth) { return; }

    var target = targetRowHeight(containerWidth);
    var rows = [];
    var row = [];
    var ratioSum = 0;

    PHOTOS.forEach(function (photo, index) {
      var ratio = photo.w / photo.h;
      row.push({ photo: photo, index: index, ratio: ratio });
      ratioSum += ratio;

      var gaps = GAP * (row.length - 1);
      if (ratioSum * target + gaps >= containerWidth) {
        rows.push({ items: row, ratioSum: ratioSum, full: true });
        row = [];
        ratioSum = 0;
      }
    });

    if (row.length) {
      rows.push({ items: row, ratioSum: ratioSum, full: false });
    }

    var html = rows.map(function (r) {
      var gaps = GAP * (r.items.length - 1);
      var available = containerWidth - gaps;
      // A trailing partial row keeps the target height instead of stretching
      // its few images across the full width.
      var height = r.full ? available / r.ratioSum : Math.min(target, available / r.ratioSum);

      var cells = r.items.map(function (item) {
        var w = Math.floor(height * item.ratio);
        var alt = item.photo.caption || 'Photograph by Amit Khandelwal';
        return '<a class="gallery__item" href="' + LARGE_BASE + item.photo.slug + '.jpg"' +
          ' data-index="' + item.index + '" style="width:' + w + 'px;height:' + Math.floor(height) + 'px">' +
          '<img src="' + THUMB_BASE + item.photo.slug + '.jpg" alt="' + alt + '" loading="lazy" decoding="async">' +
          '</a>';
      }).join('');

      return '<div class="gallery__row">' + cells + '</div>';
    }).join('');

    gallery.innerHTML = html;
    gallery.style.minHeight = '0';

    // Fade each thumbnail in once it has actually decoded.
    Array.prototype.forEach.call(gallery.querySelectorAll('img'), function (img) {
      if (img.complete) {
        img.classList.add('is-loaded');
      } else {
        img.addEventListener('load', function () { img.classList.add('is-loaded'); });
      }
    });
  }

  // --- Lightbox ---
  var lightbox = document.getElementById('lightbox');
  var lbImg = document.getElementById('lightbox-img');
  var lbCaption = document.getElementById('lightbox-caption');
  var lbCounter = document.getElementById('lightbox-counter');
  var current = 0;

  function preload(index) {
    if (index < 0 || index >= PHOTOS.length) { return; }
    var img = new Image();
    img.src = LARGE_BASE + PHOTOS[index].slug + '.jpg';
  }

  function show(index) {
    current = (index + PHOTOS.length) % PHOTOS.length;
    var photo = PHOTOS[current];
    lbImg.classList.remove('is-loaded');
    lbImg.src = LARGE_BASE + photo.slug + '.jpg';
    lbImg.alt = photo.caption || 'Photograph by Amit Khandelwal';
    lbCaption.textContent = photo.caption || '';
    lbCounter.textContent = (current + 1) + ' / ' + PHOTOS.length;
    preload(current + 1);
    preload(current - 1);
  }

  lbImg.addEventListener('load', function () { lbImg.classList.add('is-loaded'); });

  function open(index) {
    show(index);
    lightbox.classList.add('is-open');
    document.body.classList.add('lightbox-open');
  }

  function close() {
    lightbox.classList.remove('is-open');
    document.body.classList.remove('lightbox-open');
    lbImg.src = '';
  }

  gallery.addEventListener('click', function (event) {
    var link = event.target.closest('.gallery__item');
    if (!link) { return; }
    event.preventDefault();
    open(parseInt(link.getAttribute('data-index'), 10));
  });

  lightbox.addEventListener('click', function (event) {
    if (event.target.closest('[data-lb-next]')) { show(current + 1); return; }
    if (event.target.closest('[data-lb-prev]')) { show(current - 1); return; }
    if (event.target.closest('[data-lb-close]')) { close(); return; }
    // Clicking the backdrop (but not the photo itself) closes the viewer.
    if (!event.target.closest('.lightbox__figure')) { close(); }
  });

  document.addEventListener('keydown', function (event) {
    if (!lightbox.classList.contains('is-open')) { return; }
    if (event.key === 'Escape') { close(); }
    else if (event.key === 'ArrowRight') { show(current + 1); }
    else if (event.key === 'ArrowLeft') { show(current - 1); }
  });

  var touchX = null;
  lightbox.addEventListener('touchstart', function (event) {
    touchX = event.changedTouches[0].clientX;
  }, { passive: true });

  lightbox.addEventListener('touchend', function (event) {
    if (touchX === null) { return; }
    var delta = event.changedTouches[0].clientX - touchX;
    if (Math.abs(delta) > 50) { show(current + (delta < 0 ? 1 : -1)); }
    touchX = null;
  }, { passive: true });

  layout();

  var resizeTimer;
  window.addEventListener('resize', function () {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 150);
  });
})();
</script>
